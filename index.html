<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notion Toggle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
    }

    .toggle-container {
      width: 100%;
      text-align: center;
    }

    /* 클릭하는 이미지 */
    .toggle-image {
      width: 120px;
      max-width: 100%;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.15s ease;
    }

    .toggle-image:hover {
      transform: scale(1.05);
    }

    .toggle-image:active {
      transform: scale(0.95);
    }

    /* 펼쳐지는 내용 */
    .toggle-content {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.3s ease,
        opacity 0.2s ease,
        margin-top 0.3s ease;
      margin-top: 0;
    }

    /* 열린 상태 */
    .toggle-container.open .toggle-content {
      max-height: 1000px;
      opacity: 1;
      margin-top: 15px;
    }

    .content-box {
      padding: 20px;
      text-align: left;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body>

  <div class="toggle-container" id="toggle">

    <!-- 클릭하는 이미지 -->
    <img
      src="toggle.png"
      alt="토글"
      class="toggle-image"
      id="toggleButton"
    >

    <!-- 숨겨져 있는 내용 -->
    <div class="toggle-content">
      <div class="content-box">
        <p>여기에 원하는 내용을 넣으면 됩니다.</p>
        <p>이미지를 다시 클릭하면 이 내용이 닫힙니다.</p>
      </div>
    </div>

  </div>

  <script>
    const toggle = document.getElementById("toggle");
    const button = document.getElementById("toggleButton");

    button.addEventListener("click", function () {
      toggle.classList.toggle("open");
    });
  </script>

</body>
</html>
